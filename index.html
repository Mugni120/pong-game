<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pong Game</h1>
        
        <div class="scoreboard">
            <div class="score-container">
                <div class="player-label">Player</div>
                <div class="score" id="playerScore">0</div>
            </div>
            <div class="score-separator">:</div>
            <div class="score-container">
                <div class="player-label">Computer</div>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="center-line"></div>
            <div class="paddle left-paddle" id="leftPaddle"></div>
            <div class="paddle right-paddle" id="rightPaddle"></div>
            <div class="ball" id="ball"></div>
        </div>

        <div class="controls">
            <p>Use <strong>ARROW KEYS</strong> or <strong>MOUSE</strong> to control the left paddle</p>
            <button id="resetBtn">Reset Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
